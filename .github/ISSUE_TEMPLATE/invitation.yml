name: "🎟️ Invite Me to ship-together"
description: "Request an invitation to join the ship-together organization and Discord hangout"
title: "Invite Request: @your-github-username"
labels: ["invite-request", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        ### Join `ship-together`
        Want to make dev friends, hang out, and ship projects together? Fill this out so we can send your org invite and connect on Discord!
  - type: input
    id: github-username
    attributes:
      label: GitHub Username
      description: Your exact GitHub handle so we can send your organization invite.
      placeholder: "@your-github-handle"
    validations:
      required: true
  - type: input
    id: discord-username
    attributes:
      label: Discord Username
      description: Add your Discord handle so we can connect with you on Discord.
      placeholder: "your_discord_handle"
    validations:
      required: true
  - type: textarea
    id: interests-and-stack
    attributes:
      label: What You Build & How You Want to Jump In
      description: Share your go-to stack (Web3, full-stack, mobile, bots, scripts, design) and whether you want to co-build, pair up, review PRs, or hang out.
      placeholder: "Building with React/Next.js and Solidity, looking to pair up on weekend builds and chat on Discord..."
    validations:
      required: false
